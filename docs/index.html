<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Tree</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#141414;
      --bg2:#1c1c1c;
      --panel:rgba(255,255,255,.06);
      --panel2:rgba(255,255,255,.04);
      --border:rgba(255,255,255,.12);
      --border2:rgba(255,255,255,.18);
      --line:rgba(200,200,200,.55);
      --text:#f1f1f1;
      --muted:rgba(255,255,255,.70);
      --shadow: 0 16px 44px rgba(0,0,0,.55);
      --radius:18px;

      /* Responsive geometry (desktop/tablet default) */
      --cardW: clamp(150px, 42vw, 210px);
      --photo: clamp(96px, 24vw, 126px);
      --gap: clamp(10px, 3vw, 18px);
      --padTop: clamp(28px, 6vw, 46px);
      --liPadX: clamp(10px, 3vw, 18px);
      --stroke: 2px;
    }

    *{ box-sizing:border-box; }

    html, body{
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 20% 10%, #242424 0%, var(--bg2) 45%, var(--bg) 100%);
      color: var(--text);
      overflow: hidden;
    }

    /* ---------- Top Bar ---------- */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 14px 14px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      background: linear-gradient(to bottom, rgba(15,15,15,.92), rgba(15,15,15,.42));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .brand h1{
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .2px;
      line-height: 1.1;
    }
    .brand p{
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      max-width: 880px;
    }

    .controls{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap: wrap;
    }
    .btn{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.09);
      border-color: rgba(255,255,255,.20);
    }

    .search{
      display:flex;
      gap: 10px;
      align-items:center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 260px;
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
    }
    .search .hint{
      font-size: 12px;
      color: rgba(255,255,255,.55);
      user-select:none;
      white-space: nowrap;
    }
    .search input{
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
    }

    /* Mobile topbar layout */
    @media (max-width: 760px){
      .topbar{
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 12px 12px;
      }
      .controls{ justify-content:flex-start; }
      .search{ min-width: 0; width: 100%; }
      .brand p{ display:none; }
    }

    /* ---------- Scrollable Canvas ---------- */
    #family-tree-wrapper{
      height: calc(100vh - 72px);
      overflow: auto;
      padding: 26px 14px 80px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
    }
    @media (max-width: 760px){
      #family-tree-wrapper{ height: calc(100vh - 140px); }
    }

    #family-tree{
      width: fit-content;
      height: fit-content;
      margin: 0 auto;
    }

    /* ---------- Tree Layout ---------- */
    .tree ul{
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top: var(--padTop);
      position:relative;
      margin: 0;
      white-space: nowrap;
    }
    .tree li{
      list-style:none;
      padding: var(--padTop) var(--liPadX) 0;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* Connector lines */
    .tree li::before,
    .tree li::after{
      content:'';
      position:absolute;
      top: 0;
      width: 50%;
      height: var(--padTop);
      border-top: var(--stroke) solid var(--line);
    }
    .tree li::before{ right: 50%; }
    .tree li::after{
      left: 50%;
      border-left: var(--stroke) solid var(--line);
    }

    .tree li:only-child::before,
    .tree li:only-child::after{ display:none; }
    .tree li:only-child{ padding-top: 0; }

    .tree li:first-child::before,
    .tree li:last-child::after{ border:0; }

    .tree li:last-child::before{ border-right: var(--stroke) solid var(--line); }
    .tree li:first-child::after{ border-left: var(--stroke) solid var(--line); }

    .tree ul ul::before{
      content:'';
      position:absolute;
      top: 0;
      left: 50%;
      height: var(--padTop);
      border-left: var(--stroke) solid var(--line);
    }

    /* Collapsed (we will animate instead of display:none) */
    .tree ul.collapsed{
      display: none;
    }

    /* Couple row: ALWAYS side-by-side (PC style) */
    .couple{
      display: inline-flex;
      gap: var(--gap);
      align-items: flex-start;
      justify-content: center;
      flex-direction: row;
    }

    /* ---------- Node Card ---------- */
    .node-card{
      width: var(--cardW);
      border-radius: var(--radius);
      overflow:hidden;
      background: linear-gradient(to bottom, var(--panel), var(--panel2));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      cursor:pointer;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
      outline:none;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }
    .node-card:hover{
      transform: translateY(-2px);
      border-color: var(--border2);
      box-shadow: 0 18px 55px rgba(0,0,0,.62);
    }
    .node-card:active{
      transform: translateY(0px) scale(0.99);
    }
    .node-card:focus-visible{
      box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 18px 55px rgba(0,0,0,.62);
    }

    .node-top{
      height: 40px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 8px 10px;
      background: var(--accent, #ff8a00);
    }
    .dots{
      letter-spacing: 2px;
      font-weight: 900;
      opacity: .95;
    }
    .mini-icon{
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display:grid;
      place-items:center;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.24);
      font-size: 12px;
    }

    .node-photo{
      width: var(--photo);
      height: var(--photo);
      border-radius: 16px;
      margin: 12px auto 10px;
      overflow:hidden;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.10);
    }
    .node-photo img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
      transition: filter .25s ease, opacity .25s ease;
    }

    /* (1) grayscale only in tree view for deceased */
    .node-card.deceased-card .node-photo img{
      filter: grayscale(0.9) contrast(1.05) brightness(0.95);
    }

    .node-name{
      padding: 0 12px 8px;
      text-align:center;
      font-weight: 800;
      font-size: clamp(14px, 4.2vw, 18px);
      line-height: 1.18;
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
    }

    /* Alive/Deceased badge */
    .node-meta{
      display:flex;
      justify-content:center;
      padding: 0 12px 14px;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.88);
      white-space: nowrap;
    }
    .badge.alive{
      border-color: rgba(120,255,170,.22);
      background: rgba(20,140,70,.18);
    }
    .badge.deceased{
      border-color: rgba(255,210,120,.22);
      background: rgba(170,110,10,.20);
    }

    /* Highlight from search */
    .node-card.highlight{
      box-shadow: 0 0 0 3px rgba(255,255,255,.22), 0 24px 70px rgba(0,0,0,.70);
      border-color: rgba(255,255,255,.35);
      transform: translateY(-2px) scale(1.02);
    }

    /* ---------- (2) Fade animation for branch expand/collapse ---------- */
    @keyframes fadeInBranch {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOutBranch {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-4px); }
    }
    .branch-opening{
      animation: fadeInBranch 220ms ease-out both;
    }
    .branch-closing{
      animation: fadeOutBranch 180ms ease-in both;
    }

    /* ---------- PHONE: smaller cards, keep PC look ---------- */
    @media (max-width: 520px){
      :root{
        --cardW: 140px;
        --photo: 86px;
        --gap: 10px;
        --padTop: 26px;
        --liPadX: 8px;
      }
      .node-top{ height: 34px; padding: 7px 8px; }
      .node-name{ font-size: 14px; padding: 0 10px 6px; }
      .mini-icon{ width: 20px; height: 20px; font-size: 11px; }
      .badge{ font-size: 10px; padding: 5px 8px; }
      .node-meta{ padding-bottom: 12px; }
    }

    @media (max-width: 380px){
      :root{
        --cardW: 128px;
        --photo: 78px;
        --gap: 8px;
        --padTop: 22px;
        --liPadX: 6px;
      }
    }

    /* ---------- Modal ---------- */
    .modal{
      display:none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      z-index: 999;
      padding: 50px 16px;
      overflow:auto;
    }
    .modal-content{
      max-width: 560px;
      margin: 0 auto;
      background: #232323;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 16px 16px 14px;
      box-shadow: 0 24px 70px rgba(0,0,0,.6);
    }
    .close{
      float:right;
      font-size: 26px;
      font-weight: 900;
      color: rgba(255,255,255,.65);
      cursor:pointer;
      user-select:none;
    }
    .close:hover{ color:#fff; }

    .member-picture{
      width: min(240px, 78vw);
      height: min(240px, 78vw);
      border-radius: 20px;
      object-fit: cover;
      display:block;
      margin: 12px auto 14px;
      border: 1px solid rgba(255,255,255,.10);
      cursor: zoom-in;
    }

    /* Fullscreen image overlay */
    #image-overlay{
      display:none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 22px;
    }
    #image-overlay img{
      max-width: 92vw;
      max-height: 85vh;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 70px rgba(0,0,0,.65);
    }
    #close-button{
      position:absolute;
      top: 14px;
      right: 16px;
      font-size: 38px;
      font-weight: 900;
      color:#fff;
      cursor:pointer;
      user-select:none;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand">
      <!-- <h1>Karsan Patel's Family Tree</h1> -->
      <b>🕊️ Tree of life growing from love and legacy.</b>
      <p>Crafted with care by Sagar C. Patel, with heartfelt contributions and cherished information shared by Bharat Patel.</p>
    </div>

    <div class="controls">
      <button class="btn" id="expand-all">Expand All</button>
      <button class="btn" id="collapse-all">Collapse All</button>
    </div>

    <div class="search" title="Type a name and press Enter">
      <span class="hint">Search…</span>
      <input id="searchInput" type="text" placeholder="type a name (press Enter)" />
    </div>
  </div>

  <div id="family-tree-wrapper">
    <div id="family-tree" class="tree"></div>
  </div>

  <!-- Modal -->
  <div id="familyModal" class="modal">
    <div class="modal-content">
      <span class="close" id="modalClose">&times;</span>
      <h2 id="member-name" style="text-align:center;margin:8px 0 0;"></h2>

      <!-- NOTE: modal image stays NORMAL color (no grayscale) -->
      <img id="member-picture" class="member-picture" src="" alt="Member Picture"
           onerror="this.src='https://tinyurl.com/26hal84z'"
           onclick="openFullscreen(this.src)">

      <p id="member-birthdate"><b>Birthdate:</b></p>
      <p id="member-native"><b>Hometown:</b></p>
      <p id="member-living"><b>Resides:</b></p>
      <p id="member-deathDate"></p>
    </div>
  </div>

  <!-- Fullscreen image overlay -->
  <div id="image-overlay">
    <span id="close-button" onclick="closeFullscreen()">&#10006;</span>
    <img id="full-image" src="" alt="Full View">
  </div>

  <!-- Firebase (v8.x) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script>
    // ✅ Firebase configuration (fill yours)
    const firebaseConfig = {
            apiKey: "AIzaSyBFsvUtF5LNVVgCUBIjjGJ-Qjby9m2DTWA",
            authDomain: "family-tree-5a724.firebaseapp.com",
            projectId: "family-tree-5a724",
            storageBucket: "family-tree-5a724.appspot.com",
            messagingSenderId: "298658072073",
            appId: "1:298658072073:web:d01b234c71c48b22555ad8"
        };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cachedMembers = [];

    function fetchFamilyMembers() {
      db.collection("familyMembers").get().then((querySnapshot) => {
        const familyMembers = [];
        querySnapshot.forEach((doc) => familyMembers.push({ id: doc.id, ...doc.data() }));
        cachedMembers = familyMembers;
        displayFamilyTree(familyMembers);
      }).catch(err => console.error("Error fetching family members:", err));
    }

    function displayFamilyTree(familyMembers) {
      const familyTreeDiv = document.getElementById('family-tree');
      const rootMembers = familyMembers.filter(m => m.parentId === "00");

      if (!rootMembers.length) {
        familyTreeDiv.innerHTML = "<p style='color:rgba(255,255,255,.7)'>No root members found (parentId should be \"00\").</p>";
        return;
      }

      let html = "";
      rootMembers.forEach(root => { html += generateTreeHTML(root, familyMembers); });
      familyTreeDiv.innerHTML = `<ul>${html}</ul>`;

      addListeners(familyMembers);
      adjustScrollToCenter();
    }

    // Deceased -> grey header, Alive -> orange (or accentColor if you store it)
    function accentFor(member) {
      if (member.isDeceased === true) return "#6b6b6b";
      return member.accentColor || "#ff8a00";
    }

    function truncateName(name) {
      const n = (name || "Unknown").trim();
      return n.length > 14 ? (n.slice(0, 12) + "…") : n;
    }

    function renderLifeBadge(member) {
      const deceased = member.isDeceased === true;
      if (deceased) return `<span class="badge deceased">🕊️ Deceased</span>`;
      return `<span class="badge alive">● Alive</span>`;
    }

    function nodeCardHTML(member) {
      const accent = accentFor(member);
      const safePic = member.picUrl || "https://tinyurl.com/26hal84z";
      const deceasedClass = member.isDeceased === true ? "deceased-card" : "";

      return `
        <div class="node-card ${deceasedClass}" tabindex="0" data-id="${member.id}" style="--accent:${accent}">
          <div class="node-top">
            <span class="dots">•••</span>
            <span class="mini-icon" title="Info" data-info="${member.id}">ⓘ</span>
          </div>

          <div class="node-photo">
            <img src="${safePic}" alt="${member.name || 'Member'}"
                 onerror="this.src='https://tinyurl.com/26hal84z'">
          </div>

          <div class="node-name">${truncateName(member.name)}</div>
          <div class="node-meta">${renderLifeBadge(member)}</div>
        </div>
      `;
    }

    function generateTreeHTML(member, allMembers) {
      let html = `<li>`;

      if (member.spouseId) {
        const spouse = allMembers.find(m => m.id === member.spouseId);
        html += `<div class="couple">`;
        html += nodeCardHTML(member);
        if (spouse) html += nodeCardHTML(spouse);
        html += `</div>`;
      } else {
        html += nodeCardHTML(member);
      }

      const children = allMembers.filter(m =>
        m.parentId === member.id || (member.spouseId && m.parentId === member.spouseId)
      );

      if (children.length) {
        html += `<ul class="collapsed">`;
        children.forEach(child => { html += generateTreeHTML(child, allMembers); });
        html += `</ul>`;
      }

      html += `</li>`;
      return html;
    }

    // (2) Fade branch animation on expand/collapse
    function toggleBranch(childrenUl, open) {
      if (!childrenUl) return;

      if (open) {
        // show then fade in
        childrenUl.classList.remove('collapsed');
        childrenUl.classList.remove('branch-closing');
        childrenUl.classList.add('branch-opening');

        window.setTimeout(() => {
          childrenUl.classList.remove('branch-opening');
        }, 240);
      } else {
        // fade out then hide
        childrenUl.classList.remove('branch-opening');
        childrenUl.classList.add('branch-closing');

        window.setTimeout(() => {
          childrenUl.classList.add('collapsed');
          childrenUl.classList.remove('branch-closing');
        }, 190);
      }
    }

    function addListeners(familyMembers) {
      // Toggle children on card click
      document.querySelectorAll('.node-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target && e.target.closest('[data-info]')) return;

          const li = card.closest('li');
          const childrenUl = li ? li.querySelector(':scope > ul') : null;

          if (childrenUl) {
            const isCollapsed = childrenUl.classList.contains('collapsed');
            toggleBranch(childrenUl, isCollapsed); // open if collapsed

            setTimeout(() => {
              card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }, 60);
          }
        });

        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') card.click();
        });
      });

      // Info icon opens modal
      document.querySelectorAll('[data-info]').forEach(icon => {
        icon.addEventListener('click', (e) => {
          e.stopPropagation();
          const memberId = icon.getAttribute('data-info');
          const memberData = familyMembers.find(m => m.id === memberId);
          if (memberData) showModal(memberData);
        });
      });
    }

    function expandAllNodes() {
      document.querySelectorAll('#family-tree ul').forEach(ul => {
        if (ul.classList.contains('collapsed')) toggleBranch(ul, true);
      });
      adjustScrollToCenter();
    }

    function collapseAllNodes() {
      const tree = document.getElementById('family-tree');
      const rootUl = tree.querySelector(':scope > ul');
      tree.querySelectorAll('ul').forEach(ul => {
        if (ul !== rootUl && !ul.classList.contains('collapsed')) toggleBranch(ul, false);
        if (ul === rootUl) ul.classList.remove('collapsed');
      });
      adjustScrollToCenter();
    }

    document.getElementById('expand-all').addEventListener('click', expandAllNodes);
    document.getElementById('collapse-all').addEventListener('click', collapseAllNodes);

    function adjustScrollToCenter() {
      const wrapper = document.getElementById('family-tree-wrapper');
      const tree = document.getElementById('family-tree');
      wrapper.scrollLeft = (tree.scrollWidth - wrapper.clientWidth) / 2;
      wrapper.scrollTop  = 0;
    }

    // Search
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const q = (searchInput.value || "").trim().toLowerCase();

      document.querySelectorAll('.node-card.highlight').forEach(n => n.classList.remove('highlight'));
      if (!q) return;

      const match = cachedMembers.find(m => (m.name || "").toLowerCase().includes(q));
      if (!match) return;

      expandAllNodes();

      setTimeout(() => {
        const el = document.querySelector(`.node-card[data-id="${match.id}"]`);
        if (el) {
          el.classList.add('highlight');
          el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
          setTimeout(() => el.classList.remove('highlight'), 2600);
        }
      }, 220);
    });

    // Modal
    const modal = document.getElementById("familyModal");
    const modalClose = document.getElementById("modalClose");

    function showModal(member) {
      document.getElementById("member-name").textContent = member.name || "Member";
      document.getElementById("member-birthdate").innerHTML = `<strong>Birthdate:</strong> ${member.birthdate || 'N/A'}`;
      document.getElementById("member-native").innerHTML = `<strong>Hometown:</strong> ${member.native || 'N/A'}`;
      document.getElementById("member-living").innerHTML = `<strong>Resides:</strong> ${member.location || 'N/A'}`;

      // Show death date only if isDeceased === true
      const deathEl = document.getElementById("member-deathDate");
      if (member.isDeceased === true) {
        deathEl.style.display = 'block';
        deathEl.innerHTML = `<strong>Date of Death:</strong> ${member.deathdate || 'N/A'}`;
      } else {
        deathEl.style.display = 'none';
      }

      document.getElementById("member-picture").src = member.picUrl || "https://tinyurl.com/26hal84z";
      modal.style.display = "block";
    }

    modalClose.onclick = () => modal.style.display = "none";
    window.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = "none";
    });

    // Fullscreen image
    function openFullscreen(src) {
      const overlay = document.getElementById('image-overlay');
      const fullImg = document.getElementById('full-image');
      fullImg.src = src;
      overlay.style.display = 'flex';
    }
    function closeFullscreen() {
      document.getElementById('image-overlay').style.display = 'none';
    }

    window.onload = fetchFamilyMembers;
  </script>
</body>
</html>
